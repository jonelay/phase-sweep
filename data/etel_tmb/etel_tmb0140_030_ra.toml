# ETEL TMB+0140-030 (winding RA) — direct-drive conventional torque motor
# 22-pole reverse-salient PMSM (L_d > L_q, saliency L_q/L_d = 0.871), water-cooled.
# Source (single manufacturer datasheet, all values on one page):
#   ETEL S.A., "CONVENTIONAL TORQUE MOTOR TMB+0140-030", 07.01.2019,
#   doc code Y2gH-FADy-FRIA-QCEC, column "RA - WATER COOLING"
#   https://www.etel.ch/wp-content/uploads/TMB0140-030.pdf
#
# Datasheet footnote (*): Ku, R20, Ld/Lq are terminal-to-terminal (line-line);
# per-phase (wye) = value / 2 for R and L. psi_f is DERIVED from the back-EMF
# constant Ku (magnet-only — no reluctance double-count, unlike deriving from
# Kt): psi_f = sqrt(2)·Ku / (sqrt(3)·n_p) = sqrt(2)·2.52 / (sqrt(3)·11).
# Two independent datasheet cross-checks of that derivation + conventions:
#   Isc: psi_f/L_d = 6.610 A_peak = 4.674 A_rms vs datasheet Isc 4.67 (+0.08%)
#   Kt:  model k_T_effective at Ic = 4.42 Nm/A_rms vs datasheet Kt 4.35 (+1.7%
#        — reluctance share grows with this frame's saliency; pinned in tests)

[motor]
name = "ETEL TMB+0140-030 RA torque motor"
type = "reverse-salient PMSM (direct-drive torque motor)"

[circuit]
n_p = 11               # 2p = 22 poles (datasheet)
R_s = 4.16             # Ohm per-phase at 20 C (datasheet R20 = 8.32 terminal-to-terminal)
L_d = 0.0283           # H per-phase (datasheet Ld 56.6 mH line-line); L_d > L_q
L_q = 0.02465          # H per-phase (datasheet Lq 49.3 mH line-line)
psi_f = 0.187052       # Wb, peak per-phase — derived from Ku (see header)
I_rated_rms = 6.06     # A rms continuous (datasheet Ic, water cooling)

[drive]
U_DC = 600.0           # V (datasheet Udc nominal DC bus)
MAX_I_S = 22.345       # A peak = sqrt(2)·15.8 A_rms (datasheet Ip)
W_REF = 120.428        # rad/s = 2·pi·1150/60 (datasheet nn rated speed)

[thermal]
winding_temp_limit = 130.0   # C (datasheet θmax maximum coil temperature)
ambient_temp = 20.0          # C (datasheet θamb; = inlet water temp θw)
r_th = 0.163                 # K/W (datasheet Rth, coil to cooling reference)
thermal_time_constant = 72.9  # s (datasheet τth — enables the transient march)

[rated]
torque_Nm = 21.6       # datasheet Tc continuous torque @ Ic (water cooling)
speed_rpm = 1150       # datasheet nn rated speed (Tn = 12.2 Nm / In = 3.32 A_rms there)

[provenance]
source = "ETEL TMB+0140-030 datasheet 07.01.2019 (Y2gH-FADy-FRIA-QCEC), winding RA"
url = "https://www.etel.ch/wp-content/uploads/TMB0140-030.pdf"
motor_model = "ETEL TMB+0140-030 RA (conventional torque motor, water-cooled)"
duty = "S1 continuous at Ic/Tc with water cooling (inlet 20 C, dT_w 5 K, 2.0 l/min); Di = 40%, Dp = 5% intermittent/peak zones"
thermal_time_constant_s = 72.9   # datasheet τth
P_c_dissipation_W = 652.0        # datasheet Pc, power dissipation @ Ic
I_sc_Arms = 4.67                 # datasheet Isc max short-circuit current
# Torque-speed envelope points (REQ-0814 anchor class; speeds in rpm):
envelope_In_Arms = 3.32          # datasheet In rated current
envelope_nb_rpm = 1280.0         # datasheet nb base speed (at In; see notes)
envelope_nm_rpm = 1570.0         # datasheet nm max speed without flux weakening
envelope_Tn_Nm = 12.2            # datasheet Tn rated torque
notes = """
Smallest TMB frame — extends the water-cooled thermal_resistance-path family
to n=3+: copper loss at Ic with R_s(130 C) = 656 W vs
published Pc = 652 W (+0.7%), and vs the dT/r_th budget = 675 W (0.97).
Torque-speed envelope anchor (REQ-0814): datasheet publishes base speed
nb = 1280 rpm (voltage-limit corner at In) and no-FW max speed nm = 1570 rpm.
Model base_speed at In = 1247 rpm (-2.6%); zero-current limit
U_max/(n_p psi_f) = 1608 rpm (+2.4% vs nm — ETEL applies a ~2% voltage/EMF
margin, systematic across the family). nb,i / nb,p (intermittent/peak-current
base speeds) are deliberately NOT anchored: at 1.6-2.6x Ic the linear
inductances are saturated and the model diverges up to ~40% in both
directions — same blind spot as the stall Tp band.
Deliberately NOT in _NAMEPLATE_ANCHORS (water-cooled, thermal_resistance
budget path — see the TMB+0210 notes).
Saturation note: Kt at peak current collapses (Tp/Ip = 2.51 vs Kt 4.35
Nm/A_rms), so linear-magnetics results above Ic are upper bounds.
Eligible for: rated_torque, stall_torque, thermal_duty (thermal_resistance
path), torque_speed (nb/nm points at In and no-load only).
"""
