# ETEL TMB+0290-030 (winding RA) — direct-drive conventional torque motor
# 66-pole reverse-salient PMSM (L_d > L_q, saliency L_q/L_d = 0.927), water-cooled.
# Source (single manufacturer datasheet, all values on one page):
#   ETEL S.A., "CONVENTIONAL TORQUE MOTOR TMB+0290-030", 07.01.2019,
#   doc code Y2gH-FADL-GBIA-QCEC, column "RA - WATER COOLING"
#   https://www.etel.ch/wp-content/uploads/TMB0290-030.pdf
#
# Datasheet footnote (*): Ku, R20, Ld/Lq are terminal-to-terminal (line-line);
# per-phase (wye) = value / 2 for R and L. psi_f is DERIVED from the back-EMF
# constant Ku (magnet-only — no reluctance double-count, unlike deriving from
# Kt): psi_f = sqrt(2)·Ku / (sqrt(3)·n_p) = sqrt(2)·11.3 / (sqrt(3)·33).
# Two independent datasheet cross-checks of that derivation + conventions:
#   Isc: psi_f/L_d = 13.22 A_peak = 9.35 A_rms vs datasheet Isc 9.37 (-0.24%)
#   Kt:  model k_T_effective at Ic = 19.61 Nm/A_rms vs datasheet Kt 19.6 (+0.03%)

[motor]
name = "ETEL TMB+0290-030 RA torque motor"
type = "reverse-salient PMSM (direct-drive torque motor)"

[circuit]
n_p = 33               # 2p = 66 poles (datasheet)
R_s = 6.55             # Ohm per-phase at 20 C (datasheet R20 = 13.1 terminal-to-terminal)
L_d = 0.02115          # H per-phase (datasheet Ld 42.3 mH line-line); L_d > L_q
L_q = 0.0196           # H per-phase (datasheet Lq 39.2 mH line-line)
psi_f = 0.279588       # Wb, peak per-phase — derived from Ku (see header)
I_rated_rms = 7.50     # A rms continuous (datasheet Ic, water cooling)

[drive]
U_DC = 600.0           # V (datasheet Udc nominal DC bus)
MAX_I_S = 29.133       # A peak = sqrt(2)·20.6 A_rms (datasheet Ip)
W_REF = 20.8393        # rad/s = 2·pi·199/60 (datasheet nn rated speed)

[thermal]
winding_temp_limit = 130.0   # C (datasheet θmax maximum coil temperature)
ambient_temp = 20.0          # C (datasheet θamb; = inlet water temp θw)
r_th = 0.0670                # K/W (datasheet Rth, coil to cooling reference)
thermal_time_constant = 45.3  # s (datasheet τth — enables the transient march)

[rated]
torque_Nm = 133.0      # datasheet Tc continuous torque @ Ic (water cooling)
speed_rpm = 199        # datasheet nn rated speed (Tn = 124 Nm / In = 7.39 A_rms there)

[provenance]
source = "ETEL TMB+0290-030 datasheet 07.01.2019 (Y2gH-FADL-GBIA-QCEC), winding RA"
url = "https://www.etel.ch/wp-content/uploads/TMB0290-030.pdf"
motor_model = "ETEL TMB+0290-030 RA (conventional torque motor, water-cooled)"
duty = "S1 continuous at Ic/Tc with water cooling (inlet 20 C, dT_w 5 K, 4.9 l/min); Di = 40%, Dp = 5% intermittent/peak zones"
thermal_time_constant_s = 45.3   # datasheet τth
P_c_dissipation_W = 1570.0       # datasheet Pc, power dissipation @ Ic
I_sc_Arms = 9.37                 # datasheet Isc max short-circuit current
# Torque-speed envelope points (REQ-0814 anchor class; speeds in rpm):
envelope_In_Arms = 7.39          # datasheet In rated current
envelope_nb_rpm = 238.0          # datasheet nb base speed (at In; see notes)
envelope_nm_rpm = 350.0          # datasheet nm max speed without flux weakening
envelope_Tn_Nm = 124.0           # datasheet Tn rated torque
notes = """
Middle TMB frame, 66-pole. Water-cooled thermal_resistance-path anchor:
copper loss at Ic with R_s(130 C) = 1583 W vs published Pc = 1570 W (+0.8%),
vs the dT/r_th budget = 1642 W (0.96). Note In ≈ Ic on this winding (7.39 vs
7.50 A_rms) — the rated point uses nearly the full continuous current, and
the model base speed lands closest to nb here (-1.1%).
Torque-speed envelope anchor (REQ-0814): nb = 238 rpm, nm = 350 rpm;
model base_speed at In = 235 rpm (-1.1%), zero-current limit 359 rpm (+2.4%).
nb,i / nb,p deliberately NOT anchored (saturated-inductance regime; the
model even lands on the other side of nb,i here, +2.8%).
Deliberately NOT in _NAMEPLATE_ANCHORS (water-cooled, thermal_resistance
budget path — see the TMB+0210 notes).
Saturation note: Kt at peak current collapses (Tp/Ip = 13.9 vs Kt 19.6
Nm/A_rms), so linear-magnetics results above Ic are upper bounds.
Eligible for: rated_torque, stall_torque, thermal_duty (thermal_resistance
path), torque_speed (nb/nm points at In and no-load only).
"""
