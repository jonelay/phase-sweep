# Kollmorgen GOLDLINE B-series two-ambient rating columns (25 windings)
#
# Source: Kollmorgen, "GOLDLINE Brushless Servomotor Series" datasheet
#   (Artisan Technology Group reprint), 10x/20x/40x PERFORMANCE DATA tables
#   (printed pages 3-5, 11-13, 19-21), all 4-pole, VMax 250 Vrms line-line.
#   https://www.artisantg.com/info/Kollmorgen_GoldLineMotorSeries_Datasheet.pdf
#   Same document and column format as the B-104-B anchor
#   (data/kollmorgen_b104b/kollmorgen_b104b_ipm.toml).
#
# Every column publishes continuous stall torque at TWO ambients
# (Tc @ 40 C and Tc @ 25 C), the continuous line current Ic (pairs with the
# 40 C rating via the printed Kt), DC line-line resistance
# Rm at 25 C, motor constant Km at 25 C, and stall thermal resistance Rth.
# That over-determines the winding rating temperature theta two
# datasheet-only ways, with NO electrical model (no Ld/Lq/psi_f) needed:
#   ratio path    (Tc25/Tc40)^2 = (theta-25)/(theta-40)   [R_s, Rth cancel]
#   absolute path theta = 40 + Rth * 1.5*Rm*Ic^2 * (1 + alpha_cu*(theta-25))
#                 (3-phase copper loss at Ic, per-phase R = Rm/2, copper
#                  derated to theta)
# Result (pinned in tests/test_thermal_duty.py): the absolute path lands at
# 154.6-158.4 C on ALL 25 columns — the whole family is rated to one
# winding design temperature (~156 C, Class H limit 180 C, thermostats
# 155/170 C) through exactly the relation thermal_duty's
# thermal_resistance budget path models. The ratio path agrees at the
# median but scatters (121-182 C): Tc is quoted to 2-3 significant
# figures, and the ratio is ill-conditioned against that rounding.
#
# Units: Tc in N-m, Ic in A rms (line), Kt in Nm/A_rms (stall +/-10%),
# Kb in Vrms(line-line)/kRPM (+/-10%), Rm in Ohm line-line at 25 C
# (+/-10%), Km in Nm/sqrt(W) at 25 C, Rth in K/W at stall, n_rated in RPM.
# Continuous ratings on the 203x305x6.4 mm isolated aluminum heat sink.
#
# Transcription note: B-402-A's Kt is entered as 2.25 Nm/A_rms, converted
# from the printed 1.66 lb-ft/A_rms; the datasheet's own N-m row misprints
# 2.51 there (1.66 lb-ft = 2.251 N-m, and sqrt(3)*Kb confirms 2.25 — the
# per-column Kt = sqrt(3)*Kb consistency test in the suite is what caught
# it). All other N-m values are the datasheet's own.

[provenance]
source = "Kollmorgen GOLDLINE Brushless Servomotor Series datasheet (Artisan reprint), 10x/20x/40x performance tables"
url = "https://www.artisantg.com/info/Kollmorgen_GoldLineMotorSeries_Datasheet.pdf"
duty = "S1 continuous stall ratings at 25 C and 40 C ambient, air-cooled on reference heat sink"
notes = """
Two-ambient air-cooled r_th consistency family: extends the B-104-B
two-ambient analysis (n=1) to n=25 with datasheet-only
values. NOT motor anchors — no per-column electrical model exists (only
B-104-B has thesis-measured Ld/Lq/psi_f), so these columns validate the
thermal rating relation, not MTPA. B-104-B's row must stay consistent
with data/kollmorgen_b104b/kollmorgen_b104b_ipm.toml (guarded in tests).
Eligible for: thermal_duty rating-relation consistency tests only.
"""

