# Actuator Outrunner — Aluminum Rotor
# 12-pole (6 pole pairs), 9-slot, SPMSM outrunner
# Geometry from caliper/micrometer/gauge-pin measurements + geometry.py derivation

[motor]
name = "Actuator Aluminum Rotor"
type = "SPMSM"
topology = "outrunner"

[circuit]
n_p = 6
R_s = 0.139              # Ohm (phase, from L-L decomposition: 142.4+140.2+133.8 / 3 = 138.8 mOhm)
L_d = 12.5e-6            # H (L_self - M = 9.03 - (-3.49) = 12.52 uH)
L_q = 12.5e-6            # H (SPMSM, L_d = L_q)
                         # Source: 6-pair LCR 1kHz measurements (2026-03-16), Brown=neutral
                         # Same stator winding as steel rotor variant
                         # Full decomposition in separate script
# psi_f omitted — derive from B_rem via winding params
J = 4.07e-7              # kg*m2, rotor-only geometric estimate (cylindrical shell model)
                         # Shell uses effective density 5275 kg/m3 (aluminum + steel ring
                         # composite, ~50/50 by thickness — ring geometry not measured).
                         # NdFeB magnets at rho=7500 kg/m3.
                         # Rotor-only, no shaft or coupling load inertia — may add 10-30%
                         # Not measured — update when physical measurement available
I_rated = 4.53           # A pk (= MAX_I_S; supply-limited, not thermally characterized)

[winding]
n_slots = 9
N = 8                    # turns per coil (bottom layer; top layer may have 1-2 fewer)
coils_series = 3         # 9 slots / 3 phases = 3 coils per phase, no parallel branches
layers = 2
k_w = 0.866              # ideal double-layer 9s/12p: kp = sin(2pi/3), kd = 1

[geometry]
topology = "outrunner"
r_outer = 0.009645       # m (rotor shell OD/2, 19.29/2 mm)
r_rotor = 0.008515       # m (cup ID/2, shell OD/2 - wall)
r_magnet = 0.007212      # m (magnet inner face/2, r_rotor - magnet thickness)
r_stator = 0.006950      # m (stator OD/2, 13.9/2 mm — same stator)
r_inner = 0.003000       # m (stator bore/2, 6.0/2 mm, nominal — same stator)
n_slots = 9
slot_depth = 0.003            # m (3.0 mm, caliper estimate)
slot_width_ratio = 0.45       # body at yoke; tooth narrows from 3.6 mm to ~1.5 mm
slot_opening_width = 0.0008      # m; bore opening gap (~0.165 of 4.85 mm pitch)
alpha_p = 0.654              # from geometry.py (chord-to-arc corrected at cup ID)
L_stk = 0.007            # m (7 mm)
# back_iron_thickness = ?  # steel ring inside the Al cup (mu_r=1 shell beyond);
#   unset = whole 1.13 mm wall modeled as iron. Sensitivity scoped in
#   scripts/back_iron_sweep.py (thin ring saturates: -27% B1 at 0.2 mm,
#   knee ~0.96 mm); committed value blocked on the steel-ring caliper measurement.

[materials]
magnet_type = "NdFeB_N52"    # nominal, suspected below spec
B_rem = 1.45                 # T (N52 nominal at 20C, may need derating)
mu_r_pm = 1.05
B_knee = 0.30                # T (N52 typical at 20 C; actual grade suspect — conservative)
steel_grade = "unknown"      # TBD — use generic soft iron until identified
mu_r_fe = 3000               # assumption: generic silicon steel (grade unknown)

[drive]
U_DC = 24.0              # V (bench test baseline; SMPS design range is 24–48 V)
MAX_I_S = 4.53           # A (3.2A supply limit * sqrt(2))
                         # CAUTION: 3.2A is DC bus limit from bench supply; conversion to
                         # peak phase assumes RMS=DC for resistive load at stall. Verify
                         # against motor controller current limit setting.
W_REF = 1047.2           # rad/s (10000 RPM mechanical)

[validation]
# Measured (no-load torque-constant power-balance, 2026-04-14, 10-80 rps,
# CW+CCW, two runs). Back-EMF scope routes failed here on the FIXTURE, not
# signal size (alu back-EMF 1.41 V > steel 1.21 V): self-powered/coast-down
# gives 60 Hz pickup + cap discharge on disconnect and I*Z contamination
# powered — see data/actuator_aluminum_rotor/README.md. psi_f derived from Kt via
# Kt = slope(T_em vs Iq), T_em = (P_elec - 1.5*R_s*Iq^2)/omega; psi_f = Kt/(1.5*n_p).
psi_f_measured = 0.000312     # Wb (0.312 mWb; run spread 0.304-0.321, soft upper bound)
Ke_measured = 0.001873        # V/(rad/s) mechanical (n_p * psi_f)
Kt_measured = 0.002808        # Nm/A (1.5 * n_p * psi_f)
# psi_f_measured = 0.000312 is the through-origin Kt (as-recorded). Bias-
# corrected best estimate ~0.000299 (physical loss fit removes ~20 mW inverter
# loss; range 0.285-0.320). Model (Carter-consistent) 0.438 mWb = +47% vs the
# corrected estimate (+40% vs the recorded 0.312). Decomposition: ~2/3 of the
# over-prediction is
# the SAME raw-2D bias the steel rotor has (grade + 3D/k_end + profile,
# effective B_rem ~1.139 T); ~1/3 is an aluminum-specific gap OVER-credit — the
# model predicts +29% flux for the tighter gap but the rotors deliver only +12%,
# so the zhu_howe field is ~2.5x too gap-sensitive. NOT "tighter gap amplifies
# the bias," NOT a magnet-grade signal. Clean open-phase back-EMF recoverable
# on the steel jig (see data/actuator_aluminum_rotor/README.md).

[provenance]
source = "Motor lab measurements"
geometry_tool = "geometry.py"
rotor_variant = "aluminum shell with steel ring insert"
notes = """
Aluminum rotor has thicker wall (1.13 mm vs 0.90 mm steel) due to steel ring.
Air gap 0.262 mm — roughly half the steel variant's 0.528 mm. The tighter
clearance makes this variant more sensitive to assembly tolerances.
Gauge pin cross-check shows ~0.15 mm discrepancy (glue/adhesive layer on magnets
not captured by caliper measurements).
1-D magnetic circuit over-predicts at this gap — model 0.448 mWb (smooth) /
0.438 (Carter) vs measured 0.312 recorded / ~0.299 bias-corrected (+47% Carter
vs corrected). See [validation] for the gap-over-credit decomposition
(NOT gap amplification).
psi_f, Ke, Kt: measured via power-balance torque constant (see [validation]).
Current-limited stall: bench supply limits at 3.2 A DC bus.
Electromagnetic stall (V_phase/R_s ~ 92 A) is thermally unrealizable.
System stall torque: T_output = Kt * I_limit.
"""
