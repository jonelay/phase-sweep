[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phasesweep"
version = "0.2.0"
description = "PMSM simulation for stator/rotor design exploration"
requires-python = ">=3.12"
authors = [{name = "Jone"}]
license = {text = "LGPL-2.1-only"}
readme = "README.md"
keywords = ["motor", "pmsm", "bldc", "fem", "simulation"]
dependencies = [
    "numpy",
    "matplotlib",
    "motulator>=0.7.3,<0.8",  # _fix_mtpv_nan patches 0.7.x privates (_psi_s_mtpv)
    "ngsolve",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
mkl = ["mkl"]
test = ["pytest", "pytest-timeout"]
dev = ["ruff"]

[project.urls]
Repository = "https://github.com/jonelay/phase-sweep"

[project.scripts]
phasesweep-import = "phasesweep.cli_import:main"
phasesweep-crossval = "phasesweep.cli_crossval:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # line length — handled by formatter if needed
    "SIM108",   # ternary — often less readable in math-heavy code
    "UP007",    # X | None vs Optional — already using modern syntax
    "RUF001",   # ambiguous unicode in strings — physics symbols (μ, τ, θ)
    "RUF002",   # ambiguous unicode in docstrings — same
    "RUF003",   # ambiguous unicode in comments — same
    "RUF059",   # unused unpacked variables — common in scientific code (_, _, mesh, gfu = ...)
    "SIM300",   # yoda conditions — style preference, not a bug
    "B007",     # unused loop variable — loop vars often kept for readability in scripts
    "B905",     # zip-without-strict — noisy, not a bug risk here
    "RUF012",   # mutable class default — test parametrize lists, not a risk
    "RUF015",   # next(iter()) vs [0] — readability preference in tests
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]  # sys.path setup before imports
"tests/*.py" = ["F841"]    # unused vars in tests (assigned for side effects)

[tool.ruff.lint.isort]
known-first-party = ["phasesweep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
timeout_method = "thread"
markers = [
    "req(ids): traces test to requirement IDs (e.g. @pytest.mark.req('REQ-0701'))",
    "slow: marks tests as slow (FEM integration, expect >60s)",
]
