[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phasesweep"
version = "0.5.0"
description = "PMSM simulation for stator/rotor design exploration"
requires-python = ">=3.12"
authors = [{name = "Jone Lay", email = "jlay.dev@pm.me"}]
license = {text = "LGPL-2.1-only"}
readme = "README.md"
keywords = ["motor", "pmsm", "bldc", "fem", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
fem = ["ngsolve", "mkl; sys_platform == 'linux'"]
sim = ["motulator==0.7.3"]  # _fix_mtpv_nan patches 0.7.x privates (_psi_s_mtpv);
                            # 0.7.4+ moved sensorless/T_s into the Cfg dataclass,
                            # which breaks build_sim's ctor kwargs
viz = ["matplotlib"]
server = ["fastapi", "uvicorn[standard]", "structlog", "tomli-w"]
all = ["phasesweep[fem,sim,viz,server]"]
gpu = ["cupy-cuda12x"]
mkl = ["mkl"]  # ngsolve PARDISO/BLAS backend — never imported directly
test = ["pytest", "pytest-timeout", "httpx"]
dev = ["ruff", "mypy"]

[project.urls]
Repository = "https://github.com/jonelay/phase-sweep"
Issues = "https://github.com/jonelay/phase-sweep/issues"
Changelog = "https://github.com/jonelay/phase-sweep/blob/main/CHANGELOG.md"

[project.scripts]
phasesweep-import = "phasesweep.validation.cli_import:main"
phasesweep-crossval = "phasesweep.validation.cli_crossval:main"
phasesweep-calibrate = "phasesweep.validation.cli_calibrate:main"
phasesweep-server = "phasesweep.server.__main__:main"

[tool.hatch.build.targets.sdist]
exclude = [
    "AGENTS.md",
    "CLAUDE.md",
    ".claude/",
    "notes/",
    "output/",
    "results/",
    "docs/internal/",
    "docs/refs/",
    "docs/datasheets/",
    "data/*/captures/",
    # Third-party DOI dataset (10.3217/sns1d-77m43) — gitignored, but
    # hatchling does not honor the nested data/creator_case_pmsm/.gitignore,
    # so it shipped in the sdist. Not ours to redistribute.
    "data/creator_case_pmsm/PM_synchronous_motor.zip",
    "data/creator_case_pmsm/PM_synchronous_motor/",
    # ... and the dataset-DERIVED files the fetch script regenerates —
    # gitignored as "Not shipped" but hatchling ignores nested .gitignores,
    # so they leak into the sdist from a fetched checkout without these.
    "data/creator_case_pmsm/ferrite_bh.csv",
    "data/creator_case_pmsm/iron_losses_measured.csv",
    "data/creator_case_pmsm/m250_35a_bh_50hz.csv",
    "data/creator_case_pmsm/no_load_torque_measured.csv",
    "data/creator_case_pmsm/backemf_measured.json",
    "data/creator_case_pmsm/iron_loss_noload.json",
    # Same for the IM sibling dataset (10.3217/kh3v7-dhn98, CC BY-NC 4.0)
    "data/creator_case_im/Induction_motor.zip",
    "data/creator_case_im/Induction_motor/",
    "data/creator_case_im/locked_rotor_tests.csv",
    "data/creator_case_im/no_load_tests.csv",
    # Elmer harness working dirs — gitignored via nested
    # scripts/elmer_*/.gitignore files, which hatchling does not honor
    # (same trap as the CREATOR datasets above), so local solver output
    # (~23 MB of meshes and logs) leaks into a sdist built from a
    # working tree without these.
    "scripts/elmer_radial/cases/",
    "scripts/elmer_axial/cases/",
    "scripts/elmer_axial/work*/",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # line length — handled by formatter if needed
    "SIM108",   # ternary — often less readable in math-heavy code
    "UP007",    # X | None vs Optional — already using modern syntax
    "RUF001",   # ambiguous unicode in strings — physics symbols (μ, τ, θ)
    "RUF002",   # ambiguous unicode in docstrings — same
    "RUF003",   # ambiguous unicode in comments — same
    "RUF059",   # unused unpacked variables — common in scientific code (_, _, mesh, gfu = ...)
    "SIM300",   # yoda conditions — style preference, not a bug
    "B007",     # unused loop variable — loop vars often kept for readability in scripts
    "B905",     # zip-without-strict — noisy, not a bug risk here
    "RUF012",   # mutable class default — test parametrize lists, not a risk
    "RUF015",   # next(iter()) vs [0] — readability preference in tests
    "RUF043",   # pytest.raises match= metacharacters — match strings are prose fragments;
                # substring-regex overreach is harmless there, and re.escape at ~19 sites hurts readability
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]  # sys.path setup before imports
"tests/*.py" = ["F841"]    # unused vars in tests (assigned for side effects)

[tool.ruff.lint.isort]
known-first-party = ["phasesweep"]

[tool.mypy]
files = ["phasesweep"]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["ngsolve.*", "netgen.*", "motulator.*", "cupy", "scipy.*"]
ignore_missing_imports = true

# Mutation testing — mutmut is not a declared dependency:
#   uv pip install mutmut && mutmut run "phasesweep.solvers.analytical.*"
# The whole package is copied so imports resolve inside mutants/; restrict
# which mutants actually run with the positional filter above.
[tool.mutmut]
source_paths = ["phasesweep"]
also_copy = ["tests", "motors", "data", "scripts", "pyproject.toml", "phasesweep/defaults.toml"]
pytest_add_cli_args_test_selection = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
timeout_method = "thread"
markers = [
    "req(ids): traces tests to internal requirement IDs",
    "slow: marks tests as slow (FEM integration, expect >60s)",
    "fem: needs ngsolve — apply via tests.conftest.requires_fem, never directly",
]
